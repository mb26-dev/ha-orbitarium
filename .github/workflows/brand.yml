name: Build brand images

on:
  push:
    paths:
      - "brand_src/**"
      - ".github/workflows/brand.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    name: Render PNG brand images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-dejavu-core
      - name: Render
        run: |
          out=custom_components/orbitarium/brand
          mkdir -p "$out"
          rsvg-convert -w 256 -h 256 brand_src/icon.svg -o "$out/icon.png"
          rsvg-convert -w 512 -h 512 brand_src/icon.svg -o "$out/icon@2x.png"
          rsvg-convert -h 256 brand_src/logo.svg -o "$out/logo.png"
          rsvg-convert -h 512 brand_src/logo.svg -o "$out/logo@2x.png"
          rsvg-convert -h 256 brand_src/dark_logo.svg -o "$out/dark_logo.png"
          rsvg-convert -h 512 brand_src/dark_logo.svg -o "$out/dark_logo@2x.png"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/orbitarium/brand
          git diff --cached --quiet || (git commit -m "Render brand images" && git push)
